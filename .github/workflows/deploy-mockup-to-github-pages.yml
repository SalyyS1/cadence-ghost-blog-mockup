name: Deploy mockup to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Screenshot harnesses are internal tooling, keep them off the client-facing site
      - run: rm -f mockup/_*.html
      # Only the static mockup is published; the site root maps to mockup/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mockup
      - id: deployment
        uses: actions/deploy-pages@v4
